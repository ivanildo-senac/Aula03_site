<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Card sobre Vale das Sombras, meu jogo favorito.">
    <link rel="stylesheet" href="style.css">
    <title>Vale das Sombras — meu card favorito</title>
</head>

<body>
    <main>
        <header>
            <h1>God of War</h1>
            <p>jogo de ação e aventura e Mitologia · 2018</p>
        </header>
        <figure>
            <img src="img/thumb-1920-843016.jpg" alt="Capa do jogo: figura encapuzada de costas diante de um vale ao luar"
                width="1200" height="480">
            <figcaption>Arte de capa da edição de lançamento.</figcaption>
        </figure>
        <h2>Por que eu gosto</h2>
        <p>O jogo não explica nada. Você entra no vale sem mapa e sem tutorial.</p>
        <h2>Ficha técnica</h2>
        <table>
            <caption>Dados da edição de 2024</caption>
            <tbody>
                <tr>
                    <th scope="row">Gênero</th>
                    <td>Aventura, exploração</td>
                </tr>
                <tr>
                    <th scope="row">Lançamento</th>
                    <td>set/2024</td>
                </tr>
                <tr>
                    <th scope="row">Plataformas</th>
                    <td>PC e consoles</td>
                </tr>
            </tbody>
        </table>
    </main>
    <footer>
        <p>Card feito por Maria Silva · UC15</p>
    </footer>
</body>

</html>
